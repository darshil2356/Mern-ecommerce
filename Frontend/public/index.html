<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <title>Yashoda Fashion | Premium Fashion & Clothing Brand</title>
    <meta
      name="description"
      content="Yashoda Fashion – Premium Fashion & Clothing Brand. Shop the latest trends, new arrivals, and exclusive deals online in India."
    />
    <meta
      name="keywords"
      content="fashion, clothing, online shopping, premium fashion, Yashoda Fashion, trendy clothes, new arrivals, India"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.yashodafashion.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yashoda Fashion" />
    <meta property="og:title" content="Yashoda Fashion | Premium Fashion & Clothing Brand" />
    <meta property="og:description" content="Shop the latest fashion trends with Yashoda Fashion – Premium Clothing Brand." />
    <meta property="og:image" content="https://www.yashodafashion.com/logo512.png" />
    <meta property="og:url" content="https://www.yashodafashion.com/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yashoda Fashion | Premium Fashion" />
    <meta name="twitter:description" content="Shop the latest fashion trends with Yashoda Fashion." />
    <meta name="twitter:image" content="https://www.yashodafashion.com/logo512.png" />

    <!-- Preconnects for performance (also helps SEO via Core Web Vitals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS — loaded async to avoid render-blocking (Core Web Vitals fix) -->
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
      />
    </noscript>

    <!-- Organization JSON-LD (site-wide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Yashoda Fashion",
      "url": "https://www.yashodafashion.com",
      "logo": "https://www.yashodafashion.com/logo512.png",
      "sameAs": [
        "https://www.instagram.com/yashodafashion",
        "https://www.facebook.com/yashodafashion"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "info@yashodafashion.com",
        "availableLanguage": "English"
      }
    }
    </script>

    <style>
      html { scroll-behavior: smooth; }
      .initial-loader {
        position: fixed; inset: 0; background: #1a1a1a;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s ease;
      }
      .initial-loader.fade-out { opacity: 0; pointer-events: none; }
      .loader-logo {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem; color: #d4af37;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <div class="loader-logo">
          <span style="color: #d4af37;">YASHODA</span><span style="color: #fff;"> FASHION</span>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) loader.classList.add('fade-out');
        }, 500);
      });

      // Pass Firebase config to service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function(reg) {
          if (reg.active) {
            reg.active.postMessage({
              type: 'FIREBASE_CONFIG',
              config: {
                apiKey: '%REACT_APP_FIREBASE_API_KEY%',
                authDomain: '%REACT_APP_FIREBASE_AUTH_DOMAIN%',
                projectId: '%REACT_APP_FIREBASE_PROJECT_ID%',
                storageBucket: '%REACT_APP_FIREBASE_STORAGE_BUCKET%',
                messagingSenderId: '%REACT_APP_FIREBASE_MESSAGING_SENDER_ID%',
                appId: '%REACT_APP_FIREBASE_APP_ID%'
              }
            });
          }
        }).catch(function(err) {
          console.warn('SW registration failed:', err);
        });
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
